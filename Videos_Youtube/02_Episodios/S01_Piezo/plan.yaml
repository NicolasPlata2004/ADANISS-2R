# S01 · El cristal que convierte un golpe en electricidad — versión solo-3D (definitiva).
# Todas las escenas son renders 3D. La versión anterior (3D + insertos 2D) está en plan_mixto.yaml.
# Sin audio todavía: los tiempos salen del guion (guion_a_tiempos.py). Cuando llegue la voz:
#   añade  audio: audio/S01_NARRACION.wav  y ejecuta producir.bat S01_Piezo
episodio: S01_Piezo
titulo: "El cristal que convierte un golpe en electricidad"
formato: taller3d
fps: 24
cola: 10
adelanto: 0.25
subtitulos: true

escenas:
  # ------------------------------------------------------------------ GANCHO
  - id: encendedor
    escena: Encendedor
    seccion: "EFECTO PIEZOELÉCTRICO"
    capitulo: "Intro: miles de voltios sin pilas"
    desde: inicio
    marcas:
      clic: "haces clic"
      golpe: "golpea un cristal"
      chispa: "escupiendo miles"
      sinpilas: "Sin pilas"
  - id: usos3
    escena: Vitrina
    desde: "Ese mismo truco"
    props:
      items:
        - {modelo: reloj, texto: "reloj de cuarzo", marca: reloj}
        - {modelo: ecografia, texto: "ecografía", marca: bebe}
        - {modelo: motor, texto: "sensor de golpeteo", marca: motor}
    marcas:
      reloj: "tu reloj cuente"
      bebe: "vea a un bebé"
      motor: "el motor de tu carro"
  - id: cristaldual
    escena: CristalDual
    desde: "Todo depende de un material"
    marcas:
      aprieta: "cuando lo aprietas"
      electricidad: "produce electricidad"
      mueve: "se mueve"

  # ------------------------------------------------------------------ PROMESA
  - id: titulo
    escena: TituloPiezo
    desde: "Se llama efecto"
  - id: agenda
    escena: Agenda3D
    desde: "En este video vas a ver"
    props:
      modelo: piezo
      items:
        - {texto: "Dentro del cristal, átomo por átomo", marca: uno}
        - {texto: "El sensor de menos de un dólar", marca: dos}
        - {texto: "Conectado a un ESP32", marca: tres}
    marcas:
      uno: "qué pasa dentro"
      dos: "cómo se fabrica"
      tres: "cómo conectarlo"

  # ------------------------------------------------------------------ DÓNDE ESTÁ
  - id: usoscasa
    escena: Vitrina
    seccion: "DÓNDE ESTÁ"
    capitulo: "Dónde está el piezo"
    desde: "El pitido de muchos"
    props:
      items:
        - {modelo: microondas, texto: "microondas", sub: "el pitido", marca: microondas}
        - {modelo: humo, texto: "detector de humo", sub: "la alarma", marca: humo}
        - {modelo: celular, texto: "cristal de cuarzo", sub: "el ritmo del procesador", marca: cuarzo}
    marcas:
      microondas: "El pitido de muchos"
      humo: "detectores de humo"
      cuarzo: "Dentro de tu celular"
  - id: usosmundo
    escena: Vitrina
    desde: "Las ecografías usan"
    props:
      items:
        - {modelo: ecografia, texto: "ecografías", sub: "cientos de elementos", marca: eco}
        - {modelo: parqueo, texto: "sensores de parqueo", sub: "gritan y escuchan el eco", marca: parqueo}
        - {modelo: impresora, texto: "impresoras de tinta", sub: "disparan gotas", marca: impresora}
        - {modelo: guitarra, texto: "guitarras", sub: "bajo el puente", marca: guitarra}
        - {modelo: motor, texto: "motores", sub: "escucha la detonación", marca: motor}
    marcas:
      eco: "Las ecografías"
      parqueo: "Los sensores de parqueo"
      impresora: "Algunas impresoras"
      guitarra: "muchas guitarras"
      motor: "En los motores"

  # ------------------------------------------------------------------ LA FÍSICA
  - id: red
    escena: RedAtomos
    seccion: "LA FÍSICA"
    capitulo: "La física: átomos que se corren"
    desde: "Cómo puede un cristal"
    marcas:
      edificio: "Un cristal es un edificio"
      cuarzo: "En el cuarzo"
      cargas: "cada átomo tiene"
      neutro: "eléctricamente neutro"
  - id: aprieta
    escena: RedAprieta
    desde: "Ahora apriétalo"
    marcas:
      acercan: "se acercan y se corren"
      desplazan: "el centro de las cargas"
      caras: "una cara del cristal"
      voltaje: "Eso es un voltaje"
      cable: "Si unes las dos caras"
  - id: inverso
    escena: RedInverso
    desde: "Y funciona al revés"
    marcas:
      pila: "conectas el cristal a una pila"
      deforma: "el cristal se deforma"
      nombre: "directo e inverso"
  - id: dinamica
    escena: CargaSeEscapa
    desde: "Fíjate en un detalle"
    marcas:
      quieto: "te quedas quieto"
      escapa: "se va escapando"
      cambios: "solo nota los"
      arroz: "bolsa de arroz"

  # ------------------------------------------------------------------ LA HISTORIA
  - id: historia
    escena: Vitrina
    seccion: "LA HISTORIA"
    capitulo: "La historia: de los Curie al sonar"
    desde: "Esto lo descubrieron"
    props:
      linea: true
      separacion: 11
      items:
        - {modelo: cuarzo, anio: "1880", texto: "Jacques y Pierre Curie", sub: "aprietan cuarzo y sal de Rochelle", marca: curie}
        - {modelo: cuarzoPila, anio: "1881", texto: "Gabriel Lippmann", sub: "predice el efecto inverso", marca: lippmann}
        - {modelo: transductor, anio: "1917", texto: "Paul Langevin", sub: "ultrasonido con cuarzo", marca: submarinos}
    marcas:
      curie: "Jacques y Pierre"
      lippmann: "Gabriel Lippmann"
      submarinos: "Durante décadas"
  - id: sonar
    escena: Sonar3D
    desde: "En la Primera Guerra"
    marcas:
      submarinos: "detectarlos bajo el agua"
      langevin: "Paul Langevin"
      base: "la base del sonar"
  - id: cuarzopzt
    escena: CuarzoPZT
    desde: "Hoy casi nadie usa cuarzo"
    marcas:
      pzt: "el PZT"
  - id: polarizar
    escena: Polarizar3D
    desde: "Recién horneada"
    marcas:
      direcciones: "en todas las direcciones"
      calienta: "se calienta"
      campo: "un campo eléctrico muy fuerte"
      polarizar: "se le llama"
      responde: "responde muchísimo"

  # ------------------------------------------------------------------ ANATOMÍA
  - id: hero
    escena: PiezoHero
    seccion: "EL DISCO"
    capitulo: "Anatomía del disco de 1 dólar"
    desde: "Ahora sí, el sensor"
    marcas:
      dolar: "menos de un dólar"
  - id: despiece
    escena: PiezoDespiece
    desde: "Es un disco de latón"
    marcas:
      laton: "disco de latón"
      ceramica: "capa delgadísima"
      plata: "película plateada"
      cables: "Dos cables"
  - id: corte
    escena: PiezoCorte
    desde: "Cuando algo golpea"
    marcas:
      dobla: "se dobla como"
      curva: "El latón se curva"
      voltaje: "hace aparecer voltaje"
  - id: golpe
    escena: PiezoGolpe
    desde: "Un golpe seco"
    marcas:
      pico: "picos de varios"
  - id: zumbador
    escena: Zumbador
    desde: "Si en vez de golpearlo"
    marcas:
      vibra: "el disco vibra"
      micro: "Así suena el zumbador"
      escucha: "una vez escucha"
      habla: "la otra vez habla"

  # ------------------------------------------------------------------ ESP32
  - id: montaje
    escena: MontajeESP32
    seccion: "CON UN ESP32"
    capitulo: "Con un ESP32: un sensor de golpes"
    desde: "Vamos a convertirlo"
    marcas:
      tierra: "Conecta el cable negro"
      entrada: "el rojo a una entrada"
      resistencia: "una resistencia de un megaohmio"
      pegada: "se queda pegada"
  - id: proteccion
    escena: Proteccion3D
    desde: "Y un detalle que salva"
    marcas:
      picos: "pueden superar"
      resistencia: "Una resistencia en serie"
      zener: "un diodo zener"
      recortan: "recortan esos picos"
  - id: codigo
    escena: Codigo3D
    desde: "El programa es sencillo"
    props:
      lineas:
        - "const int PIEZO = 34;     // entrada analógica"
        - "const int UMBRAL = 300;"
        - ""
        - "void loop() {"
        - "  int v = analogRead(PIEZO);"
        - "  if (v > UMBRAL) {        // ¡golpe!"
        - "    Serial.println(v);     // qué tan fuerte"
        - "  }"
        - "}"
      resaltar:
        - {linea: 4, marca: lees}
        - {linea: 5, marca: umbral}
        - {linea: 6, marca: altura}
    marcas:
      lees: "Lees la entrada"
      umbral: "supera un umbral"
      osc: "conéctalo a un osciloscopio"
      campana: "como una campana"
      altura: "la altura del pico"
  - id: diy
    escena: Vitrina
    desde: "Con eso ya tienes"
    props:
      items:
        - {modelo: bateria, texto: "pad de batería", marca: pad}
        - {modelo: escalera, texto: "contador de pasos", marca: escalera}
        - {modelo: puerta, texto: "cerradura de golpes", sub: "abre con tu ritmo secreto", marca: cerradura}
    marcas:
      pad: "un pad de"
      escalera: "un contador de pasos"
      cerradura: "una cerradura"
  - id: mesa
    escena: Mesa
    desde: "Si pegas el disco"
    marcas:
      tres: "si pones tres"
      orden: "en qué instante"
      estimar: "estimar dónde"

  # ------------------------------------------------------------------ LÍMITES Y DATOS
  - id: limites
    escena: Vitrina
    seccion: "LÍMITES"
    capitulo: "Los límites"
    desde: "Un piezo no mide fuerzas"
    props:
      numerado: true
      color: "#FFB547"
      items:
        - {modelo: pesa, texto: "no mide fuerzas quietas", marca: quietas}
        - {modelo: calor, texto: "temperatura de Curie", sub: "pierde el efecto", marca: curie}
        - {modelo: plomo, texto: "lleva plomo", sub: "se buscan cerámicas sin plomo", marca: plomo}
        - {modelo: pelicula, texto: "películas flexibles", sub: "ropa, zapatos y puentes", marca: futuro}
    marcas:
      quietas: "no mide fuerzas"
      curie: "temperatura de Curie"
      plomo: "lleva plomo"
      futuro: "películas piezoeléctricas flexibles"
  - id: reloj
    escena: RelojCuarzo
    seccion: "TRES DATOS"
    capitulo: "Tres datos curiosos"
    desde: "Tres datos para"
    marcas:
      diapason: "un diapasón de cristal"
      vibra: "que vibra"
      potencia: "No es un número"
      divide: "Un circuito lo divide"
      segundo: "un pulso por segundo"
  - id: hueso
    escena: Hueso3D
    desde: "Dos: tus huesos"
    marcas:
      colageno: "El colágeno genera"
      peso: "soporta peso"
      fortalece: "se fortalece"
  - id: baldosas
    escena: Baldosas3D
    desde: "Tres: en Japón"
    marcas:
      tokio: "en la estación de Tokio"
      bombillo: "un bombillo de cien"
      ciudad: "no va a encender"

  # ------------------------------------------------------------------ CIERRE
  - id: recap
    escena: Recap
    seccion: "RESUMEN"
    capitulo: "Resumen"
    desde: "Recapitulemos"
    marcas:
      atomos: "átomos que se corren"
      cargas: "cargas que aparecen"
      usos: "Con eso se encienden"
  - id: final
    escena: Encendedor
    desde: "La próxima vez que hagas"
    props: {final: true}
    marcas:
      golpe: "estás golpeando"
  - id: proximo
    escena: Vitrina
    desde: "En el próximo episodio"
    props:
      titulo: "Próximo episodio"
      sub: "S02 · la pantalla táctil"
      items:
        - {modelo: celular, texto: "con tu dedo, sí", marca: dedo}
        - {modelo: guante, texto: "con guantes, no", marca: guantes}
        - {modelo: salchicha, texto: "¿con una salchicha?", marca: salchicha}
    marcas:
      dedo: "con tu dedo"
      guantes: "con guantes"
      salchicha: "con una salchicha"
